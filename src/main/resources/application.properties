spring.application.name=buspoint

# PostgreSQL / Supabase
# Configure through environment variables. Never commit database credentials.
spring.datasource.url=${BUSPOINT_DB_URL}
spring.datasource.username=${BUSPOINT_DB_USERNAME}
spring.datasource.password=${BUSPOINT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=app
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
